name: Rust

on:
  push:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Standard Tests
    if: ${{ contains(github.event.head_commit.message, '[ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
          POSTGRES_INITDB_ARGS: "-c max_connections=500"
        ports:
          - 5430:5432
        options: >-
          --health-cmd pg_isready --health-interval 1s --health-timeout 1s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        id: cache-test-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5430; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Run tests
        run: cargo test --verbose

      - uses: actions/cache/save@v4
        id: cache-test-save
        if: (success() || failure()) && steps.cache-test-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
