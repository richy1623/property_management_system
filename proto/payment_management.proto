syntax = "proto3";
package property_management_system.payment_management;

// import "common/date.proto";

service PaymentManagement {
    rpc CreatePayment (PaymentCreationRequest) returns (PaymentCreationResponse);
}

message PaymentCreationRequest {
    string jwt_token = 1;
    int32 ownership_id = 2;
    string username = 3;
    Date date = 4;
    int32 amount = 5;
    string reference = 6;
    string proof_of_payment_path = 7;
}

message PaymentCreationResponse {
    string message = 1;
}


// A message to represent a calendar date (no time component).
message Date {
    // Year of the date, e.g., 2025
    int32 year = 1;
  
    // Month of the date, from 1 (January) to 12 (December)
    int32 month = 2;
  
    // Day of the month, from 1 to 31 depending on the month and year
    int32 day = 3;
}
