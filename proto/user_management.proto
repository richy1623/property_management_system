syntax = "proto3";
package user_management;

service UserManagement {
    rpc CreateUser (UserCreationRequest) returns (UserCreationResponse);
}

message UserCreationRequest {
    // Request message contains the name to be greeted
    string user_name = 1;
    string name = 2;
    optional string cellphone_number = 3;
    optional string email_address = 4;
    optional string identification_number = 5;
    string password = 6;
}

message UserCreationResponse {
    // Reply contains the greeting message
    string message = 1;
}
