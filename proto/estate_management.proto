syntax = "proto3";
package property_management_system.estate_management;

service EstateManagement {
    rpc CreateEstate (EstateCreationRequest) returns (Estate);
    rpc GetAllEstates (Empty) returns (EstateList);
}

message Empty {}

message Estate {
    int32 estate_id = 1; 
    string name = 2;
    string location = 3;
    string district = 4;
    string landmark = 5;
}

message EstateCreationRequest {
    string jwt_token = 1;
    string name = 2;
    string location = 3;
    string district = 4;
    string landmark = 5;
}

message EstateList {
    repeated Estate estates = 1;
}

