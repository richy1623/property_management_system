[package]
name = "PropertyManagementSystem"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2.9", features = ["postgres"] }
pq-sys = { version = "0.7.1", features = ["bundled"] }
openssl-sys = { version = "0.9.107", features = ["vendored"] } 
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
rand_core = "0.9.3"
password-hash = "0.5"
