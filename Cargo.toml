[package]
name = "property_management_system"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2.12", features = ["postgres", "chrono", "r2d2"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
diesel_migrations = "2.2.0"
pq-sys = { version = "0.7.2", features = ["bundled"] }
openssl-sys = { version = "0.9.109", features = ["vendored"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
# TODO Update when v6 of password hash comes out
argon2 = { version = "0.5" }
rand_core = { version = "0.6", features = ["getrandom"] }
password-hash = { version = "0.5", features = ["rand_core"] }
chrono = { version = "0.4.41", features = ["serde"] }
once_cell = "1.21.3"
uuid = { version = "1.18.0", features = ["v4"] }
tonic = "0.13.1"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread"] }
jsonwebtoken = "9.3.1"
strum = { version = "0.27.2", features = ["derive"] }
num_enum = "0.7.4"
aes-gcm = "0.10.3"
env_logger = "0.11.8"
envy = "0.4.2"
actix-web = { version = "4.11.0", features = [] }
utoipa = { version = "5.4.0", features = ["macros", "actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
actix-cors = "0.7.1"

[build-dependencies]
tonic-build = "0.13.1"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.21.0"


[[bin]]
name = "user_management_service_server"
path = "src/bin/user_management_service_server.rs"

[[bin]]
name = "payment_management_service_server"
path = "src/bin/payment_management_service_server.rs"

[[bin]]
name = "artifact_management_service_server"
path = "src/bin/artifact_management_service_server.rs"

[[bin]]
name = "property_management_service_server"
path = "src/bin/property_management_service_server.rs"

[[bin]]
name = "management_api_server"
path = "src/bin/management_api_server.rs"
