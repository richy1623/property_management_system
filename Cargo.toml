[package]
name = "property_management_system"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2.10", features = ["postgres", "chrono", "r2d2"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
diesel_migrations = "2.2.0"
pq-sys = { version = "0.7.1", features = ["bundled"] }
openssl-sys = { version = "0.9.108", features = ["vendored"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TODO Update when v6 of password hash comes out
argon2 = { version = "0.5" }
rand_core = { version = "0.6", features = ["getrandom"] }
password-hash = { version = "0.5", features = ["rand_core"] }
chrono = { version = "0.4.41", features = ["serde"] }
once_cell = "1.21.3"
uuid = { version = "1.16.0", features = ["v4"] }
tonic = "0.13.1"
prost = "0.13"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
jsonwebtoken = "9.3.1"

[build-dependencies]
tonic-build = "0.13.1"

[dev-dependencies]
rstest = "0.25.0"
